<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HarmonyOSGym Virtual Apps - 虚拟应用预览台</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --border: #334155;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "HarmonyOS Sans", sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 24px 36px;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }
    .brand h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand h1 span {
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .brand p {
      color: var(--text-muted);
      font-size: 13px;
      margin-top: 4px;
    }
    .nav-tabs {
      display: flex;
      gap: 8px;
    }
    .tab-btn {
      background: #0f172a;
      color: var(--text-muted);
      border: 1px solid var(--border);
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn:hover {
      color: #fff;
      border-color: var(--accent);
    }
    .tab-btn.active {
      background: var(--accent);
      color: #0f172a;
      border-color: var(--accent);
      font-weight: 600;
    }
    .main-container {
      flex: 1;
      padding: 28px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 40px;
      flex-wrap: wrap;
    }
    .app-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
    }
    .card-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .app-info h2 {
      font-size: 16px;
      font-weight: 600;
    }
    .app-info .meta {
      font-size: 12px;
      color: var(--text-muted);
    }
    .open-link {
      font-size: 12px;
      color: var(--accent);
      text-decoration: none;
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 6px;
      transition: all 0.15s;
    }
    .open-link:hover {
      background: rgba(56, 189, 248, 0.1);
      border-color: var(--accent);
    }
    .phone-mockup {
      width: 396px;
      height: 854px;
      border: 8px solid #334155;
      border-radius: 40px;
      overflow: hidden;
      background: #000;
      position: relative;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
    }
    .phone-notch {
      position: absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 110px;
      height: 20px;
      background: #1e293b;
      border-radius: 12px;
      z-index: 10;
    }
    .phone-frame-wrapper {
      width: 1320px;
      height: 2848px;
      transform-origin: top left;
      transform: scale(0.3);
      position: absolute;
      top: 0;
      left: 0;
    }
    .phone-frame-wrapper iframe {
      width: 1320px;
      height: 2848px;
      border: none;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <h1><span>HarmonyOSGym</span> 虚拟应用运行态</h1>
      <p>由真实鸿蒙 ArkUI 页面 Dump (pageInfo.json) 自动转译与渲染</p>
    </div>
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="showAll()">并排全览</button>
      <button class="tab-btn" onclick="showApp('xhs')">仅看小红书</button>
      <button class="tab-btn" onclick="showApp('vmall')">仅看华为商城</button>
    </div>
  </header>

  <main class="main-container">
    <!-- 华为商城 -->
    <div class="app-card" id="card-vmall">
      <div class="card-header">
        <div class="app-info">
          <h2>华为商城 (VMall)</h2>
          <div class="meta">包名: com.huawei.hmos.vmall · 1320×2848</div>
        </div>
        <a class="open-link" href="com.huawei.hmos.vmall/index.html" target="_blank">全屏打开 ↗</a>
      </div>
      <div class="phone-mockup">
        <div class="phone-notch"></div>
        <div class="phone-frame-wrapper">
          <iframe src="com.huawei.hmos.vmall/index.html" title="华为商城虚拟应用"></iframe>
        </div>
      </div>
    </div>

    <!-- 小红书 -->
    <div class="app-card" id="card-xhs">
      <div class="card-header">
        <div class="app-info">
          <h2>小红书 (Xiaohongshu)</h2>
          <div class="meta">包名: com.xingin.xhs_hos · 1320×2848</div>
        </div>
        <a class="open-link" href="com.xingin.xhs_hos/index.html" target="_blank">全屏打开 ↗</a>
      </div>
      <div class="phone-mockup">
        <div class="phone-notch"></div>
        <div class="phone-frame-wrapper">
          <iframe src="com.xingin.xhs_hos/index.html" title="小红书虚拟应用"></iframe>
        </div>
      </div>
    </div>
  </main>

  <script>
    function showAll() {
      document.getElementById('card-vmall').style.display = 'flex';
      document.getElementById('card-xhs').style.display = 'flex';
      updateActiveTab(0);
    }
    function showApp(app) {
      document.getElementById('card-vmall').style.display = (app === 'vmall') ? 'flex' : 'none';
      document.getElementById('card-xhs').style.display = (app === 'xhs') ? 'flex' : 'none';
      updateActiveTab(app === 'xhs' ? 1 : 2);
    }
    function updateActiveTab(idx) {
      var btns = document.querySelectorAll('.tab-btn');
      btns.forEach(function(b, i) {
        if (i === idx) b.classList.add('active');
        else b.classList.remove('active');
      });
    }
  </script>
</body>
</html>
